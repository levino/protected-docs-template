# Production overlay of this site. Argo CD (Application `protected-docs-template-example` in
# levino/server-config) reads THIS directory — from the branch `production`,
# which the deploy job writes after every build: main's tree plus the pinned
# image tag(s) below. Humans never push to `production`.
#
# The tag is the commit SHA of the running build. Never `latest`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: protected-docs-template-example
resources:
  - workloads.yaml
  - ingress.yaml
images:
  - name: ghcr.io/levino/protected-docs-template
    newTag: "0000000000000000000000000000000000000000"
