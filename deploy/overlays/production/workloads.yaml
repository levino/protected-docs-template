# protected-docs-template-example: the site is built by CI and published as the branch `production-dist`
# of levino/protected-docs-template; the init container clones that branch at pod start, the main
# container is a public runtime image and never changes. The annotation
# `levinkeller.de/dist-commit` is rewritten by the deploy job on every publish,
# which is what makes the pod restart and fetch the new output. A pod that
# restarts on its own uses whatever `github-app-token` holds at that moment
# (refreshed every 45 min by cluster/github-app-tokens); the token is only
# needed for private repos and only at start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protected-docs-template-example
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: protected-docs-template-example
  template:
    metadata:
      labels:
        app: protected-docs-template-example
      annotations:
        levinkeller.de/dist-commit: "0000000000000000000000000000000000000000"
    spec:
      enableServiceLinks: false
      initContainers:
      - name: fetch-dist
        image: alpine/git:2.47.2
        env:
        - name: REPO
          value: "levino/protected-docs-template"
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: github-app-token
              key: token
              optional: true
        command: ["sh", "-ec"]
        args:
          - |
            if [ -n "${TOKEN:-}" ]; then U="https://x-access-token:${TOKEN}@github.com/${REPO}"; else U="https://github.com/${REPO}"; fi
            # /site is an emptyDir: it belongs to the pod, not the container,
            # so a RESTARTED init container still finds the previous run's
            # clone in it and `git clone` dies with "destination path already
            # exists and is not an empty directory" -- forever, since the
            # directory never gets any emptier. That is not hypothetical: the
            # k3s restart on 2026-09-07 bounced this container in three sites
            # at once and left them in Init:CrashLoopBackOff with 250 restarts
            # and a 503 for a day. Start from empty every time.
            find /site -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git clone --quiet --depth 1 --branch production-dist "$U" /site
            rm -rf /site/.git
            echo "dist $(cat /site/.dist-commit 2>/dev/null || echo '?')"
        volumeMounts:
        - name: site
          mountPath: /site
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
      containers:
      - name: protected-docs-template-example
        image: ghcr.io/levino/levins-pocketbase-auth-layer:v1
        ports:
        - containerPort: 3000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
        - name: POCKETBASE_URL
          value: "https://api.demo.levinkeller.de"
        - name: POCKETBASE_GROUP
          value: "example"
        volumeMounts:
        - name: site
          mountPath: /app/build
          readOnly: true
        readinessProbe:
          tcpSocket: { port: 3000 }
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: site
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: protected-docs-template-example
spec:
  selector:
    app: protected-docs-template-example
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
