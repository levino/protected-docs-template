apiVersion: apps/v1
kind: Deployment
metadata:
  name: protected-docs-template-example
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: protected-docs-template-example
  template:
    metadata:
      labels:
        app: protected-docs-template-example
    spec:
      containers:
      - name: protected-docs-template-example
        image: ghcr.io/levino/protected-docs-template
        ports:
        - containerPort: 3000
        env:
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: '3000'
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: protected-docs-template-example
spec:
  selector:
    app: protected-docs-template-example
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
